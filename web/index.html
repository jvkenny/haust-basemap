<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haust Basemaps</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  html, body { height: 100%; margin: 0; }
  #map { position: absolute; inset: 0; }
  body { font: 13px/1.3 "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif; background: #E8EDF2; }
  #bar { position: absolute; top: 12px; left: 12px; z-index: 2; display: flex; gap: 2px; padding: 3px;
    background: #F6F8FA; border: 1px solid #1F1D18; }
  #bar button { font: inherit; font-weight: 600; letter-spacing: .04em; padding: 6px 12px; border: 0;
    background: transparent; color: #405664; cursor: pointer; min-height: 32px; }
  #bar button[aria-pressed=true] { background: #405664; color: #F6F8FA; }
  #bar button:focus-visible { outline: 2px solid #B95A1F; outline-offset: 1px; }
  #zoom { position: absolute; bottom: 12px; left: 12px; z-index: 2; padding: 4px 8px; background: #F6F8FA;
    border: 1px solid #1F1D18; color: #1F1D18; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="bar" role="group" aria-label="Basemap style"></div>
<div id="map"></div>
<div id="zoom"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script>
const STYLES = { topographic: 'Topographic', canvas: 'Canvas', atlas: 'Atlas', dark: 'Dark' };
const base = location.origin;
maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
const load = slug => fetch(`${base}/styles/haust-${slug}.json`, { cache: 'no-store' })
  .then(r => r.json());
const q = new URLSearchParams(location.search);
let current = q.get('style') in STYLES ? q.get('style') : 'topographic';
let map;
load(current).then(style => {
  map = new maplibregl.Map({ container: 'map', style, hash: true, maxZoom: 19, attributionControl: { compact: true } });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-right');
  const z = document.getElementById('zoom');
  const tick = () => z.textContent = 'z ' + map.getZoom().toFixed(2);
  map.on('move', tick); tick();
  window.map = map;
});
const bar = document.getElementById('bar');
for (const [slug, label] of Object.entries(STYLES)) {
  const b = document.createElement('button');
  b.textContent = label; b.setAttribute('aria-pressed', slug === current);
  b.onclick = async () => {
    current = slug; map.setStyle(await load(slug));
    for (const x of bar.children) x.setAttribute('aria-pressed', x === b);
    const u = new URL(location); u.searchParams.set('style', slug); history.replaceState(null, '', u);
  };
  bar.append(b);
}
</script>
</body>
</html>
